nt-size:9px}.utility{max-width:135px}.field-row{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .25s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}

[data-filter="春"],[data-season="春"],#season option[value="春"]{--season-ink:#99435f;--season-bg:#f8e4ec}

.filter[data-filter="春"][aria-pressed="true"],.filter[data-filter="夏"][aria-pressed="true"],.filter[data-filter="秋"][aria-pressed="true"],.filter[data-filter="冬"][aria-pressed="true"]{color:white;background:var(--season-ink);box-shadow:none}

<body>
<a class="skip" href="#main">句帳へ移動</a>
<header><div class="brand"><div class="mark" aria-label="月白の印"><svg viewBox="0 0 64 64" role="img" aria-label="月と短冊をあしらった月白の印"><path d="M19 8h26v48H19z" fill="#f7f1e4"/><path d="M33 17a12 12 0 1 0 0 24 9 9 0 1 1 0-24" fill="#a64231"/><path d="M24 47c7-2 12-1 17 1" fill="none" stroke="#243a46" stroke-width="2.6" stroke-linecap="round"/></svg></div><div><div class="brand-name">月白</div><small>TSUKISHIRO</small></div></div><p class="header-note">ことばに残す、季節のひとこま。</p><div class="utility"><button class="quiet" id="export">バックアップ</button><button class="quiet" id="csv-export">CSV出力</button><button class="quiet" id="import">復元</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></header>
<main class="layout" id="main">
<section aria-labelledby="notebook-title">
<p class="eyebrow">MY HAIKU NOTEBOOK</p><div class="heading-row"><h1 id="notebook-title">わたしの句帳</h1><div class="total"><strong id="total">0</strong>句</div></div><p class="intro">見つけた景色も、ふと浮かんだ一行も。</p>
<div id="storage-error" class="notice" role="alert" hidden></div>
<label for="search" class="hidden">句・季語・メモを検索</label><input id="search" class="search" type="search" placeholder="句・季語・メモを検索" aria-label="句・季語・メモを検索">
<div class="filters" aria-label="絞り込み"><button class="filter" data-filter="すべて" aria-pressed="true">すべて</button><button class="filter" data-filter="春" aria-pressed="false">春</button><button class="filter" data-filter="夏" aria-pressed="false">夏</button><button class="filter" data-filter="秋" aria-pressed="false">秋</button><button class="filter" data-filter="冬" aria-pressed="false">冬</button><button class="filter favorite-filter" id="favorites" aria-pressed="false">☆ お気に入り</button></div>
<div class="list-head"><span id="result-count" aria-live="polite">0句</span><select class="sort" id="sort" aria-label="句の並び順"><option value="new">日付が新しい順</option><option value="old">日付が古い順</option></select></div>
<div class="cards" id="cards"></div><button class="primary mobile-compose" id="mobile-add">＋ 一句詠む</button>
</section>
<aside class="editor closed" id="editor" aria-labelledby="editor-title"><div class="editor-head"><h2 id="editor-title">一句詠む</h2><span>五・七・五</span></div>
<form id="entry-form"><div class="field"><label for="poem">俳句 <span class="optional">必須</span></label><textarea id="poem" maxlength="200" required placeholder="ここに、あなたの一句を。&#10;改行して入力できます。"></textarea><p class="hint">字余り・字足らず、自由律もそのまま残せます。</p></div>
<fieldset class="rhythm-options"><legend>音数のタグ<span class="optional">（任意）</span></legend><div class="choices"><label><input type="radio" name="rhythm" id="rhythm-none" value="" checked>なし</label><label><input type="radio" name="rhythm" id="extra" value="extra">字余り</label><label><input type="radio" name="rhythm" id="short" value="short">字足らず</label></div></fieldset>
<div class="field-row"><div class="field"><label for="kigo">季語<span class="optional">任意</span></label><input id="kigo" maxlength="50" placeholder="例：秋の風"></div><div class="field"><label for="season">季節</label><select id="season"><option>春</option><option>夏</option><option>秋</option><option>冬</option><option value="新年" hidden disabled>新年（以前の記録）</option><option value="無季" hidden disabled>季節未指定</option></select></div></div>
<div class="field"><label for="date">詠んだ日</label><input id="date" type="date" required min="0001-01-01" max="9999-12-31"></div>
<div class="field"><label for="memo">メモ<span class="optional">任意</span></label><textarea id="memo" rows="3" maxlength="2000" placeholder="場所、情景、そのときの気持ちなど"></textarea></div>
<button class="primary save" type="submit" id="save">句帳に残す</button><button class="quiet cancel" type="button" id="cancel">やめる</button>
<p class="storage-note">このブラウザーに保存されます。端末間では同期されません。大切な句はバックアップを。</p></form></aside>
</main><footer><span>月白 — 日々の余白に、十七音。</span><span>あなたの句は、外部へ送信されません。</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">この句を削除しますか？</h2><p id="confirm-description">削除した句は元に戻せません。</p><div class="dialog-actions"><button class="quiet" id="confirm-cancel">戻る</button><button class="primary delete-confirm" id="confirm-ok">削除する</button></div></dialog>
<script>
'use strict';
const KEY='tsukishiro.entries.v1';
const SEASONS=['春','夏','秋','冬','新年','無季'];
const $=id=>document.getElementById(id);
let entries=[], editing=null, seasonFilter='すべて', favoriteOnly=false, storageOK=true, toastTimer, confirmation=null;
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function currentSeason(){const m=new Date().getMonth()+1;return m>=3&&m<=5?'春':m>=6&&m<=8?'夏':m>=9&&m<=11?'秋':'冬'}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)||s.startsWith('0000'))return false;const d=new Date(s+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s}
function validEntries(data){return Array.isArray(data)&&data.length<=10000&&data.every(e=>e&&typeof e.id==='string'&&e.id.length>0&&e.id.length<100&&typeof e.poem==='string'&&e.poem.trim()&&e.poem.length<=200&&typeof e.kigo==='string'&&e.kigo.length<=50&&typeof e.memo==='string'&&e.memo.length<=2000&&SEASONS.includes(e.season)&&validDate(e.date)&&typeof e.favorite==='boolean'&&(e.extra===undefined||typeof e.extra==='boolean')&&(e.short===undefined||typeof e.short==='boolean'))&&new Set(data.map(e=>e.id)).size===data.length}
function cleanEntry(e){return {id:e.id,poem:e.poem,kigo:e.kigo,memo:e.memo,season:e.season,date:e.date,favorite:e.favorite,extra:e.extra===true,short:e.short===true&&e.extra!==true}}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',4500)}
function storageError(message){$('storage-error').textContent=message;$('storage-error').hidden=false}
function load(){try{const raw=localStorage.getItem(KEY);if(raw!==null){const data=JSON.parse(raw);if(!validEntries(data))throw Error('invalid');entries=data.map(cleanEntry)}}catch{storageOK=false;storageError('保存データを読み込めません。データの上書きを防ぐため、保存を停止しています。バックアップから復元するか、ブラウザーの保存設定を確認してください。')}}
function persist(next,recover=false){if(!storageOK&&!recover){notify('保存を停止しています。バックアップからの復元をご利用ください。');return false}try{localStorage.setItem(KEY,JSON.stringify(next));entries=next;storageOK=true;$('storage-error').hidden=true;return true}catch{storageError('保存できませんでした。保存容量やブラウザーの設定をご確認ください。入力内容は残しています。');return false}}
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function render(){const query=$('search').value.trim().toLocaleLowerCase('ja');const result=entries.filter(e=>(seasonFilter==='すべて'||e.season===seasonFilter)&&(!favoriteOnly||e.favorite)&&(!query||[e.poem,e.kigo,e.memo,e.season].join(' ').toLocaleLowerCase('ja').includes(query))).sort((a,b)=>$('sort').value==='old'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));$('total').textContent=entries.length;$('result-count').textContent=result.length+'句'+(result.length!==entries.length?' / 全'+entries.length+'句':'');$('cards').replaceChildren();
if(!result.length){const empty=make('div','empty');empty.append(make('div','empty-mark',entries.length?'―':'句'),make('h2','',entries.length?'まだ、見つかりません':'はじめの一句を、ここから。'),make('p','',entries.length?'検索語や季節を変えて、探してみてください。':'心にとまった瞬間を、あなたのことばで。'));const btn=make('button','primary',entries.length?'絞り込みを解除':'＋ 一句詠む');btn.addEventListener('click',entries.length?resetFilters:()=>openEditor());empty.append(btn);$('cards').append(empty);return}
for(const entry of result){const card=make('article','card');card.dataset.season=entry.season;const top=make('div','card-top');const date=make('time','',entry.date.replaceAll('-','.'));date.dateTime=entry.date;const star=make('button','star',entry.favorite?'★':'☆');star.setAttribute('aria-label',entry.favorite?'お気に入りを解除':'お気に入りに追加');star.setAttribute('aria-pressed',String(entry.favorite));star.addEventListener('click',()=>{if(persist(entries.map(e=>e.id===entry.id?{...e,favorite:!e.favorite}:e)))render()});top.append(date,star);const poem=make('p','poem',entry.poem);const meta=make('div','card-meta');if(entry.season!=='無季'){const seasonTag=make('span','tag season-tag',entry.season);meta.append(seasonTag)}if(entry.extra)meta.append(make('span','tag rhythm-tag','字余り'));if(entry.short)meta.append(make('span','tag rhythm-tag','字足らず'));if(entry.kigo)meta.append(make('span','tag',entry.kigo));if(entry.memo)meta.append(make('p','memo',entry.memo));const bottom=make('div','card-bottom');const edit=make('button','text-btn','編集する');edit.addEventListener('click',()=>openEditor(entry));const del=make('button','text-btn danger','削除');del.addEventListener('click',()=>askConfirm('この句を削除しますか？','「'+entry.poem+'」\n削除した句は元に戻せません。','削除する',()=>{if(persist(entries.filter(e=>e.id!==entry.id))){if(editing===entry.id)resetForm();render();notify('句を削除しました')}}));bottom.append(edit,del);card.append(top,poem,meta,bottom);$('cards').append(card)}}
function resetFilters(){seasonFilter='すべて';favoriteOnly=false;$('search').value='';document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter==='すべて')));$('favorites').setAttribute('aria-pressed','false');render()}
function resetForm(){editing=null;$('entry-form').reset();$('rhythm-none').checked=true;$('date').value=today();$('season').value=currentSeason();$('season').dataset.season=$('season').value;$('editor-title').textContent='一句詠む';$('save').textContent='句帳に残す';$('cancel').hidden=false;$('cancel').textContent='やめる';$('poem').setCustomValidity('')}
function hasDraft(){return Boolean($('poem').value.trim()||$('kigo').value.trim()||$('memo').value.trim()||$('extra').checked||$('short').checked)}
function openEditor(entry){const apply=()=>{resetForm();if(entry){editing=entry.id;$(entry.extra?'extra':entry.short?'short':'rhythm-none').checked=true;for(const key of ['poem','kigo','season','date','memo'])$(key).value=entry[key];$('editor-title').textContent='句を推敲する';$('save').textContent='変更を残す';$('cancel').textContent='編集をやめる';$('cancel').hidden=false}$('season').dataset.season=$('season').value;$('editor').classList.remove('closed');$('poem').focus();if(matchMedia('(max-width:700px)').matches)$('editor').scrollIntoView({behavior:'auto'})};if(hasDraft())askConfirm('入力を切り替えますか？','保存していない入力内容は破棄されます。','切り替える',apply);else apply()}
function askConfirm(title,description,button,action){$('confirm-title').textContent=title;$('confirm-description').textContent=description;$('confirm-ok').textContent=button;confirmation=action;$('confirm-dialog').showModal();$('confirm-cancel').focus()}
$('confirm-cancel').addEventListener('click',()=>{$('confirm-dialog').close();confirmation=null});$('confirm-ok').addEventListener('click',()=>{const action=confirmation;confirmation=null;$('confirm-dialog').close();action?.()});$('confirm-dialog').addEventListener('cancel',()=>confirmation=null);
$('entry-form').addEventListener('submit',event=>{event.preventDefault();const poem=$('poem').value.trim();if(!poem){$('poem').setCustomValidity('俳句を入力してください。');$('poem').reportValidity();return}if(!validDate($('date').value)){notify('正しい日付を入力してください。');return}const original=entries.find(e=>e.id===editing);if(editing&&!original){notify('この句は別の画面で削除されました。入力をコピーして新しい句として保存してください。');return}const entry={id:editing||(typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),poem,kigo:$('kigo').value.trim(),season:$('season').value,date:$('date').value,memo:$('memo').value.trim(),favorite:original?.favorite||false,extra:$('extra').checked,short:$('short').checked};const next=editing?entries.map(e=>e.id===editing?entry:e):[entry,...entries];if(next.length>10000){notify('保存上限の10,000句に達しました。');return}if(persist(next)){const wasEditing=Boolean(editing);resetForm();resetFilters();$('editor').classList.add('closed');notify(wasEditing?'推敲した句を保存しました':'一句を句帳に残しました')}});
$('poem').addEventListener('input',()=>$('poem').setCustomValidity(''));
$('cancel').addEventListener('click',()=>{
const close=()=>{resetForm();$('editor').classList.add('closed');if(matchMedia('(max-width:700px)').matches)$('mobile-add').focus();else $('search').focus()};
if(hasDraft())askConfirm(editing?'編集をやめますか？':'入力をやめますか？','保存していない入力内容は破棄されます。','やめる',close);else close();
});
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{seasonFilter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));render()}));
$('favorites').addEventListener('click',()=>{favoriteOnly=!favoriteOnly;$('favorites').setAttribute('aria-pressed',String(favoriteOnly));render()});$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('mobile-add').addEventListener('click',()=>openEditor());
function downloadFile(content,type,name){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=make('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('export').addEventListener('click',()=>{if(!storageOK){notify('保存データを読み込めないため、バックアップできません。');return}downloadFile(JSON.stringify({app:'tsukishiro',version:1,exportedAt:new Date().toISOString(),entries},null,2),'application/json','tsukishiro-'+today()+'.json');notify('句帳のバックアップを出力しました')});
$('csv-export').addEventListener('click',()=>{if(!storageOK){notify('保存データを読み込めないため、CSV出力できません。');return}const cell=value=>{let text=String(value??'').replace(/\r?\n/g,' / ');if(/^[=+\-@]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'};const csv='\uFEFF'+[['俳句','季語','季節','詠んだ日','メモ','字余り','字足らず','お気に入り'],...entries.map(e=>[e.poem,e.kigo,e.season,e.date,e.memo,e.extra?'あり':'',e.short?'あり':'',e.favorite?'★':''])].map(row=>row.map(cell).join(',')).join('\r\n');downloadFile(csv,'text/csv;charset=utf-8','tsukishiro-'+today()+'.csv');notify('Excel・スプレッドシート用のCSVを出力しました')});
$('import').addEventListener('click',()=>$('import-file').click());$('import-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>30*1024*1024){notify('ファイルが大きすぎます（上限30MB）。');return}try{const data=JSON.parse(await file.text());if(data.app!=='tsukishiro'||data.version!==1||!validEntries(data.entries))throw Error('invalid');const incoming=data.entries.map(cleanEntry);askConfirm('バックアップを復元しますか？',incoming.length+'句で現在の句帳全体を置き換えます。未保存の入力も破棄されます。必要なら先に現在の句帳をバックアップしてください。','復元する',()=>{if(persist(incoming,true)){resetForm();resetFilters();notify(incoming.length+'句を復元しました')}})}catch{notify('月白の有効なバックアップファイルを選んでください。')}});
window.addEventListener('storage',event=>{if(event.key===KEY){load();render();notify('別の画面での変更を反映しました')}});
window.addEventListener('beforeunload',event=>{if(hasDraft()){event.preventDefault();event.returnValue=''}});
$('season').addEventListener('change',()=>{$('season').dataset.season=$('season').value});
load();resetForm();render();
</script>
</body>
</html>
